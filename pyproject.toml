[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wakevoice"
version = "0.2.1"
description = "A highly customizable, low-memory, multi-agent desktop voice assistant with pluggable wake word, emotional TTS, and MCP support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WakeVoice Contributors" }]
keywords = ["voice-assistant", "wake-word", "tts", "mcp", "multi-agent", "automation", "speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pyyaml>=6.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "vosk>=0.3.45",
    "pyttsx3>=2.90",
    "edge-tts>=6.1.0",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "pyperclip>=1.8.2",
    "pytesseract>=0.3.10",
    "mss>=9.0.1",
    "pillow>=10.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
wake = ["openwakeword>=0.6.0"]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.16.5,<0.17"]

[project.scripts]
wakevoice = "assistant.cli:main"
wakevoice-desktop = "assistant.cli:main"

# TODO: replace these placeholders with the real repository before the first
# public release. Keeps PyPI/GitHub metadata consistent without pointing at a
# non-existent repository.
[project.urls]
Homepage = "https://github.com/jsxxwhai/wakevoice"
Documentation = "https://github.com/jsxxwhai/wakevoice#readme"
Issues = "https://github.com/jsxxwhai/wakevoice/issues"
Source = "https://github.com/jsxxwhai/wakevoice"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
assistant = ["**/*.yaml", "**/*.yml", "**/*.json"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Stable, pragmatic rule set. New ruff releases keep adding stricter defaults
# that break CI on existing code; pin the rules this project actually follows.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = [
    "E501",     # long lines are fine; project uses 120 limit and long CN strings
    "BLE001",   # blind except Exception is intentional fallback
    "RUF012",   # mutable class attrs in test fakes acceptable
    "RUF059",   # unpacked dummy vars in tests intentional
    "RUF001",   # fullwidth punctuation in Chinese strings is intentional
    "RUF002",   # fullwidth punctuation in docstrings is intentional
    "RUF003",   # fullwidth punctuation in comments is intentional
    "SIM103",   # explicit if/return reads clearer in tests
    "SIM211",   # explicit False/True mapping reads clearer in tests
    "PIE807",   # lambda wrappers in tests acceptable
    "SIM105",   # try/except/pass is a clear, explicit fallback pattern
]
