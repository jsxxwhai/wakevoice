# Build source/wheel + portable EXE distributions and publish a GitHub Release
# when a version tag (v*) is pushed. Runs the full test+lint gate first; the
# release only happens if everything passes.
#
# Manual dispatch (workflow_dispatch on main) publishes the version read from
# pyproject.toml, so it never creates a stray tag named after the branch.
#
# The workflow uses the automatic GITHUB_TOKEN, so no personal token is stored
# in the repository. See SECURITY.md / CONTRIBUTING.md before running.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check src/ tests/ examples/ skills/ scripts/
      - name: Test
        run: pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build source/wheel distributions
        run: python -m build
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Manual dispatch on a branch: use the version from pyproject.toml.
            VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"
      - name: Upload sdist/wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-portable:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build portable EXE + zip
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_dist.py --clean --portable --zip
          ls -la build_out/
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: build_out/*portable*.zip
          if-no-files-found: error

  attach:
    needs: [publish, build-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python-dist
      - name: Download portable zip
        uses: actions/download-artifact@v4
        with:
          name: portable-zip
          path: portable
      - name: Publish release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.publish.outputs.tag }}"
          TITLE="${TAG#v}"
          echo "Publishing release ${TAG} ..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading fresh assets..."
            gh release upload "$TAG" python-dist/*.tar.gz python-dist/*.whl portable/*.zip --clobber
          else
            gh release create "$TAG" \
              python-dist/*.tar.gz python-dist/*.whl portable/*.zip \
              --title "$TITLE" \
              --notes "See [CHANGELOG.md](CHANGELOG.md) for details." \
              --latest
          fi
          echo "=== Release assets ==="
          gh release view "$TAG" --json assets --jq '.assets[].name'

  mirror-portable:
    needs: [publish, build-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-zip
          path: portable-zip
      - name: Publish matching portable release
        env:
          GH_TOKEN: ${{ secrets.PORTABLE_REPO_TOKEN }}
          REPO: jsxxwhai/wakevoice-portable
        run: |
          set -euo pipefail
          TAG="${{ needs.publish.outputs.tag }}"
          TITLE="${TAG#v}"
          ZIP=$(ls portable-zip/*portable*.zip | head -n1)
          echo "Portable zip: ${ZIP}"
          echo "Target release: ${REPO} ${TAG}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Portable release ${TAG} exists; uploading fresh zip..."
            gh release upload "$TAG" "$ZIP" --repo "$REPO" --clobber
          else
            echo "Creating portable release ${TAG} ..."
            gh release create "$TAG" "$ZIP" --repo "$REPO" \
              --title "$TITLE" \
              --notes "WakeVoice ${TITLE} portable EXE bundle - double-click WakeVoiceDesktop.exe, no Python needed. Built and uploaded automatically from the source repository." --latest
          fi
          echo "=== Portable release assets ==="
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
