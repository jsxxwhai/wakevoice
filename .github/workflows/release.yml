# Build source/wheel distributions and publish a GitHub Release when a
# version tag (v*) is pushed. Runs the full test+lint gate first; the release
# only happens if everything passes.
#
# Manual dispatch (workflow_dispatch on main) publishes the version read from
# pyproject.toml, so it never creates a stray tag named after the branch.
#
# The workflow uses the automatic GITHUB_TOKEN, so no personal token is
# stored in the repository. See SECURITY.md / CONTRIBUTING.md before running.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check src/ tests/ examples/ skills/ scripts/
      - name: Test
        run: pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Manual dispatch on a branch: use the version from pyproject.toml.
            VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading fresh assets..."
            gh release upload "$TAG" dist/*.tar.gz dist/*.whl --clobber
          else
            gh release create "$TAG" \
              dist/*.tar.gz dist/*.whl \
              --title "OpenVoice Desktop $TITLE" \
              --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
